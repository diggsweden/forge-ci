name: Setup image builder
description: Prepare the image builder CI_IMAGE_BUILDER selects, buildah (default) or kaniko by its digest-pinned job image.

inputs:
  extra-packages:
    description: Buildah only. Whitespace-separated additional apt packages to install with Buildah.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Prepare the image builder
      shell: bash
      env:
        SETUP_BUILDAH_EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        set -euo pipefail
        # shellcheck source=.engine/bin/lib-forge-ci.sh
        source "${GITHUB_ACTION_PATH}/../../../.engine/bin/lib-forge-ci.sh"
        builder=${CI_IMAGE_BUILDER:-buildah}
        case "${builder}" in
        buildah)
          run_forge_ci container setup-buildah \
            --install-packages=true \
            --probe-build=true \
            --print-store=false \
            --summary=false \
            --extra-packages "${SETUP_BUILDAH_EXTRA_PACKAGES:-}"
          ;;
        kaniko)
          job_image=${CI_IMAGE_BUILDER_JOB_IMAGE:-}
          if [[ ! "${job_image}" =~ ^[a-z0-9]+([.-][a-z0-9]+)*(:[0-9]+)?/([a-z0-9]+(([._]|__|-+)[a-z0-9]+)*/)*[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*(:[A-Za-z0-9_][A-Za-z0-9._-]{0,127})?@sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: CI_IMAGE_BUILDER=kaniko needs CI_IMAGE_BUILDER_JOB_IMAGE, the kaniko job image pinned by digest (<repository>@sha256:<64 hex>), as the kaniko job image workflow prints it; got '${job_image}'" >&2
            exit 1
          fi
          # The engine repository the job image was built from, found the way
          # the resolver finds the binary.
          if [ -n "${GITHUB_ACTION_REPOSITORY:-}" ]; then
            engine_repository="${GITHUB_SERVER_URL%/}/${GITHUB_ACTION_REPOSITORY}"
          else
            engine_repository=${FORGE_CI_REPOSITORY_URL:?a workflow that checks the layer out itself sets FORGE_CI_REPOSITORY_URL}
            # A reusable workflow's validated coordinate is a clone URL; the
            # source label names the repository without the .git suffix.
            engine_repository=${engine_repository%.git}
          fi
          case "$(uname -m)" in
          x86_64 | amd64) arch=amd64 ;;
          aarch64 | arm64) arch=arm64 ;;
          *)
            echo "ERROR: no kaniko job image for $(uname -m)" >&2
            exit 1
            ;;
          esac
          run_forge_ci container image usable-digest \
            --ref "${job_image}" \
            --arch "${arch}" \
            --require-label "org.opencontainers.image.source=${engine_repository}" \
            --require-label "org.opencontainers.image.title=forge-ci kaniko job image" >/dev/null
          ;;
        *)
          echo "ERROR: CI_IMAGE_BUILDER must be buildah or kaniko, got '${builder}'" >&2
          exit 1
          ;;
        esac
