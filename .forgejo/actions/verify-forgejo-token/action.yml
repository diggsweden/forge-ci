name: 'Verify Forgejo API token'
description: >-
  Fail fast when a Forgejo API token is empty or lacks read access to the repo, before a long release/build job is spent on a mis-scoped or missing token. The token is passed to forge-ci over stdin, never as a process argument. read:repository is sufficient.
inputs:
  token:
    description: Forgejo API token to verify.
    required: true
  repository:
    description: owner/repo to probe. Defaults to github.repository.
    required: false
    default: ${{ github.repository }}
  server-url:
    description: Forgejo server URL. Defaults to github.server_url.
    required: false
    default: ${{ github.server_url }}

runs:
  using: composite
  steps:
    - name: Verify Forgejo API token
      shell: bash
      env:
        FORGEJO_API_TOKEN: ${{ inputs.token }}
        VERIFY_REPO: ${{ inputs.repository }}
        VERIFY_SERVER: ${{ inputs.server-url }}
      # forge-ci redacts the token from its output and exits 77 when the
      # forge rejects it. The token reaches it on stdin only: not in argv,
      # and cleared from its environment.
      run: |
        set -euo pipefail
        token=${FORGEJO_API_TOKEN-}
        unset FORGEJO_API_TOKEN
        # shellcheck source=.engine/bin/lib-forge-ci.sh
        source "${GITHUB_ACTION_PATH}/../../../.engine/bin/lib-forge-ci.sh"
        printf '%s' "${token}" | FORGE_CI_PROVIDER=forgejo FORGEJO_SERVER_URL="${VERIFY_SERVER%/}" \
          run_forge_ci validate auth token --repository "${VERIFY_REPO}" --token-file -
