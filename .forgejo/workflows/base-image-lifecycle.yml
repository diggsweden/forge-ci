    outputs:
      base_images_json: ${{ steps.promote.outputs.base_images_json }}
    steps:
      - name: Checkout layer helpers
        env:
          EXPECTED_HELPERS_SHA: ${{ inputs['forge-ci-sha'] }}
        run: |
          set -euo pipefail
          if [[ ! "${EXPECTED_HELPERS_SHA}" =~ ^([0123456789abcdef]{40}|[0123456789abcdef]{64})$ ]]; then
            echo "ERROR: forge-ci-sha must be a 40- or 64-character lowercase commit hex digest" >&2
            exit 1
          fi
          signer_workspace=$(mktemp -d /tmp/forge-ci-signer.XXXXXX)
          helpers_dir="${signer_workspace}/helpers"
          consumer_dir="${signer_workspace}/consumer"
          mkdir -p "${consumer_dir}"
          {
            echo "SIGNER_WORKSPACE=${signer_workspace}"
            echo "HELPERS_DIR=${helpers_dir}"
            echo "CONSUMER_WORKSPACE=${consumer_dir}"
          } >>"${FORGEJO_ENV}"
          git init --quiet "${helpers_dir}"
          git -C "${helpers_dir}" remote add origin "${FORGE_CI_REPOSITORY_URL:?}"
          # Direct unadvertised SHA fetches can be refused.
          # Retry advertised branches/tags without assuming a default branch.
          # Disable credential prompts, retain both failures for diagnostics,
          # and verify the exact pin below with detach + rev-parse.
          helpers_fetch_log=$(mktemp)
          if ! GIT_TERMINAL_PROMPT=0 git -C "${helpers_dir}" -c protocol.version=2 fetch --quiet --no-tags --depth=1 --no-recurse-submodules origin "${EXPECTED_HELPERS_SHA}" 2>"${helpers_fetch_log}"; then
            if ! GIT_TERMINAL_PROMPT=0 git -C "${helpers_dir}" -c protocol.version=2 fetch --quiet --no-recurse-submodules origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' 2>>"${helpers_fetch_log}"; then
              echo "ERROR: cannot fetch layer helpers ${EXPECTED_HELPERS_SHA} from $(git -C "${helpers_dir}" remote get-url origin)" >&2
              echo "  (git may report 'could not read Username': this forge answers the same way for a repository that is absent and one this run cannot read, so it is not necessarily a missing credential)" >&2
              cat -- "${helpers_fetch_log}" >&2
              rm -f -- "${helpers_fetch_log}"
              exit 1
            fi
          fi
          rm -f -- "${helpers_fetch_log}"
          git -C "${helpers_dir}" checkout --quiet --detach "${EXPECTED_HELPERS_SHA}"

      - name: Verify trusted helper checkout
        env:
          EXPECTED_HELPERS_SHA: ${{ inputs['forge-ci-sha'] }}
        run: |
          set -euo pipefail
          # Input hex-validation happens once at the checkout step (workflow
          # inputs are immutable between steps); this step verifies the LIVE
          # checkout matches the pinned SHA, which subsumes the format check.
          actual_sha=$(git -C "${HELPERS_DIR:?}" rev-parse HEAD)
          if [ "${actual_sha}" != "${EXPECTED_HELPERS_SHA}" ]; then
            echo "ERROR: helper checkout resolved to unexpected commit" >&2
            echo "  expected: ${EXPECTED_HELPERS_SHA}" >&2
            echo "  actual:   ${actual_sha}" >&2
            exit 1
          fi

      # The checkout holds the binary's checksum and not the binary. It is
      # downloaded here, by that checksum and without credentials, so that no
      # later step, each of which may hold a key, has to reach the network
      # for it. The toolchain check below refuses a job that skipped this.
      - name: Fetch engine binary
        run: |
          set -euo pipefail
          # shellcheck source=.engine/bin/lib-forge-ci.sh
          source "${HELPERS_DIR:?}/.engine/bin/lib-forge-ci.sh"
          fetch_forge_ci

      - name: Verify signer toolchain
        run: |
          set -euo pipefail
          bash "${HELPERS_DIR:?}/.forgejo/scripts/verify-signer-toolchain.sh"

      - name: Checkout consumer at release SHA
        env:
          CHECKOUT_REF: ${{ inputs.release-sha }}
        run: |
          set -euo pipefail
          # shellcheck source=.engine/bin/lib-forge-ci.sh
          source "${HELPERS_DIR:?}/.engine/bin/lib-forge-ci.sh"
          FORGEJO_WORKSPACE="${CONSUMER_WORKSPACE:?}" \
            FORGE_CI_PROVIDER=forgejo \
            run_forge_ci platform checkout --ref "${CHECKOUT_REF}"

      - name: Verify signatures and promote base tags
        id: promote
        env:
          ALL_IMAGES_JSON: ''
          LEDGER_JSON: ${{ needs.publish.outputs.ledger_json }}
          REPOSITORY_SUFFIX: ${{ inputs.repository-suffix }}
          BASE_IMAGE_REPOSITORY: ${{ inputs['image-repository'] }}
          BASE_INPUT_ID: ''
          BASE_INPUTS_JSON: ${{ inputs['expected-inputs-json'] }}
          EXPECTED_WORKFLOW: ${{ inputs.caller-workflow }}
          TRUSTED_KEY_INPUT: ${{ inputs['cosign-public-key'] }}
          TRUSTED_KEY_SHA256_INPUT: ${{ inputs['cosign-public-key-sha256'] }}
          REGISTRY_TOKEN: ${{ secrets.RELEASE_REGISTRY_TOKEN }}
          REGISTRY_USER: ${{ inputs['registry-user'] || vars.RELEASE_REGISTRY_USER }}
        run: |
          set -euo pipefail
          cd "${CONSUMER_WORKSPACE:?}"
          # The caller supplies the trust root; the layer ships none. The
          # engine refuses an empty key, an empty digest and a mismatch.
          trusted_key="${SIGNER_WORKSPACE:?}/cosign.pub"
          # $(...) drops the input's trailing newlines in any shell, so the
          # file is the key and one newline, as `sha256sum cosign.pub` hashed it.
          trusted_public_key=$(printf '%s' "${TRUSTED_KEY_INPUT}")
          printf '%s\n' "${trusted_public_key}" >"${trusted_key}"
          printf '%s\n' "${TRUSTED_KEY_SHA256_INPUT}" >"${trusted_key}.sha256"
          # Stage it into the workspace (the engine requires a relative,
          # workspace-contained key path) and hand the engine its digest.
          install -m 0644 "${trusted_key}" .forge-ci-cosign.pub
          COSIGN_PUBLIC_KEY_PATH=.forge-ci-cosign.pub
          # The digest input is a bare digest; read the first field so a
          # value pasted in sha256sum format does not become the digest.
          read -r COSIGN_PUBLIC_KEY_SHA256 _ <"${trusted_key}.sha256"
          export COSIGN_PUBLIC_KEY_PATH COSIGN_PUBLIC_KEY_SHA256
          registry_token="${REGISTRY_TOKEN:?}"
          registry_user="${REGISTRY_USER}"
          unset REGISTRY_TOKEN REGISTRY_USER
          # shellcheck source=.engine/bin/lib-forge-ci.sh
          source "${HELPERS_DIR:?}/.engine/bin/lib-forge-ci.sh"
          printf '%s' "${LEDGER_JSON:?publication must return its original ledger}" >"${SIGNER_WORKSPACE}/base-images.ledger.json"
          unset LEDGER_JSON
          # The token that pushed the bases also links their package to
          # this repository once promoted, as release-images cleanup does.
          printf '%s' "${registry_token}" | FORGE_CI_PACKAGE_API_TOKEN="${registry_token}" \
            FORGE_CI_PROVIDER=forgejo run_forge_ci container base-images promote \
            --ledger "${SIGNER_WORKSPACE}/base-images.ledger.json" \
            --expected-repository "${BASE_IMAGE_REPOSITORY}" \
            --registry-username "${registry_user}" \
            --registry-password-file -

      - name: Cleanup signer workspace
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${SIGNER_WORKSPACE:-}" ]; then
            rm -rf "${SIGNER_WORKSPACE}"
          fi

  authenticate:
    name: Verify base container images
    needs: [coordinates, publish, promote]
    if: ${{ !cancelled() && needs.coordinates.result == 'success' && needs.publish.result == 'success' && needs.promote.result == 'success' }}
    runs-on: ${{ fromJSON(inputs['runs-on']) }}
    container:
      image: ${{ needs.coordinates.outputs.signer_image }}
    env:
      SIGNER_STRICT: '1'
      FORGE_CI_REPOSITORY_URL: ${{ needs.coordinates.outputs.helpers_repository }}
      FORGE_CI_COSIGN_TRANSPARENCY: ${{ needs.coordinates.outputs.transparency_log }}
    timeout-minutes: 15
    outputs:
      ledger_json: ${{ steps.verify.outputs.ledger_json }}
      parent_base_json: ${{ steps.verify.outputs.parent_base_json }}
    steps:
      - name: Checkout layer helpers
        env:
          EXPECTED_HELPERS_SHA: ${{ inputs['forge-ci-sha'] }}
        run: |
          set -euo pipefail
          if [[ ! "${EXPECTED_HELPERS_SHA}" =~ ^([0123456789abcdef]{40}|[0123456789abcdef]{64})$ ]]; then
            echo "ERROR: forge-ci-sha must be a 40- or 64-character lowercase commit hex digest" >&2
            exit 1
          fi
          signer_workspace=$(mktemp -d /tmp/forge-ci-signer.XXXXXX)
          helpers_dir="${signer_workspace}/helpers"
          consumer_dir="${signer_workspace}/consumer"
          mkdir -p "${consumer_dir}"
          {
            echo "SIGNER_WORKSPACE=${signer_workspace}"
            echo "HELPERS_DIR=${helpers_dir}"
            echo "CONSUMER_WORKSPACE=${consumer_dir}"
          } >>"${FORGEJO_ENV}"
          git init --quiet "${helpers_dir}"
          git -C "${helpers_dir}" remote add origin "${FORGE_CI_REPOSITORY_URL:?}"
          # Direct unadvertised SHA fetches can be refused.
          # Retry advertised branches/tags without assuming a default branch.
          # Disable credential prompts, retain both failures for diagnostics,
          # and verify the exact pin below with detach + rev-parse.
          helpers_fetch_log=$(mktemp)
          if ! GIT_TERMINAL_PROMPT=0 git -C "${helpers_dir}" -c protocol.version=2 fetch --quiet --no-tags --depth=1 --no-recurse-submodules origin "${EXPECTED_HELPERS_SHA}" 2>"${helpers_fetch_log}"; then
            if ! GIT_TERMINAL_PROMPT=0 git -C "${helpers_dir}" -c protocol.version=2 fetch --quiet --no-recurse-submodules origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' 2>>"${helpers_fetch_log}"; then
              echo "ERROR: cannot fetch layer helpers ${EXPECTED_HELPERS_SHA} from $(git -C "${helpers_dir}" remote get-url origin)" >&2
              echo "  (git may report 'could not read Username': this forge answers the same way for a repository that is absent and one this run cannot read, so it is not necessarily a missing credential)" >&2
              cat -- "${helpers_fetch_log}" >&2
              rm -f -- "${helpers_fetch_log}"
              exit 1
            fi
          fi
          rm -f -- "${helpers_fetch_log}"
          git -C "${helpers_dir}" checkout --quiet --detach "${EXPECTED_HELPERS_SHA}"

      - name: Verify trusted helper checkout
        env:
          EXPECTED_HELPERS_SHA: ${{ inputs['forge-ci-sha'] }}
        run: |
          set -euo pipefail
          # Input hex-validation happens once at the checkout step (workflow
          # inputs are immutable between steps); this step verifies the LIVE
          # checkout matches the pinned SHA, which subsumes the format check.
          actual_sha=$(git -C "${HELPERS_DIR:?}" rev-parse HEAD)
          if [ "${actual_sha}" != "${EXPECTED_HELPERS_SHA}" ]; then
            echo "ERROR: helper checkout resolved to unexpected commit" >&2
            echo "  expected: ${EXPECTED_HELPERS_SHA}" >&2
            echo "  actual:   ${actual_sha}" >&2
            exit 1
          fi

      # The checkout holds the binary's checksum and not the binary. It is
      # downloaded here, by that checksum and without credentials, so that no
      # later step, each of which may hold a key, has to reach the network
      # for it. The toolchain check below refuses a job that skipped this.
      - name: Fetch engine binary
        run: |
          set -euo pipefail
          # shellcheck source=.engine/bin/lib-forge-ci.sh
          source "${HELPERS_DIR:?}/.engine/bin/lib-forge-ci.sh"
          fetch_forge_ci

      - name: Verify signer toolchain
        run: |
          set -euo pipefail
          bash "${HELPERS_DIR:?}/.forgejo/scripts/verify-signer-toolchain.sh"

      - name: Checkout consumer at release SHA
        env:
          CHECKOUT_REF: ${{ inputs.release-sha }}
        run: |
          set -euo pipefail
          # shellcheck source=.engine/bin/lib-forge-ci.sh
          source "${HELPERS_DIR:?}/.engine/bin/lib-forge-ci.sh"
          FORGEJO_WORKSPACE="${CONSUMER_WORKSPACE:?}" \
            FORGE_CI_PROVIDER=forgejo \
            run_forge_ci platform checkout --ref "${CHECKOUT_REF}"

      - name: Authenticate promoted base
        id: verify
        env:
          # Authenticate the promoted digest in the same explicit repository
          # used for publication, against the consumer's independent expectations.
          LEDGER_JSON: ${{ needs.publish.outputs.ledger_json }}
          EXPECTED_REPOSITORY: ${{ inputs['image-repository'] }}
          REPOSITORY_SUFFIX: ${{ inputs.repository-suffix }}
          BASE_INPUTS_JSON: ${{ inputs['expected-inputs-json'] }}
          EXPECTED_REF: ${{ fromJSON(needs.promote.outputs.base_images_json || '[{}]')[0].ref }}
          EXPECTED_WORKFLOW: ${{ inputs.caller-workflow }}
          TRUSTED_KEY_INPUT: ${{ inputs['cosign-public-key'] }}
          TRUSTED_KEY_SHA256_INPUT: ${{ inputs['cosign-public-key-sha256'] }}
          REGISTRY_TOKEN: ${{ secrets.RELEASE_REGISTRY_TOKEN }}
          REGISTRY_USER: ${{ inputs['registry-user'] || vars.RELEASE_REGISTRY_USER }}
        run: |
          set -euo pipefail
          cd "${CONSUMER_WORKSPACE:?}"
          # The caller supplies the trust root; the layer ships none. The
          # engine refuses an empty key, an empty digest and a mismatch.
          trusted_key="${SIGNER_WORKSPACE:?}/cosign.pub"
          # $(...) drops the input's trailing newlines in any shell, so the
          # file is the key and one newline, as `sha256sum cosign.pub` hashed it.
          trusted_public_key=$(printf '%s' "${TRUSTED_KEY_INPUT}")
          printf '%s\n' "${trusted_public_key}" >"${trusted_key}"
          printf '%s\n' "${TRUSTED_KEY_SHA256_INPUT}" >"${trusted_key}.sha256"
          # Stage it into the workspace (the engine requires a relative,
          # workspace-contained key path) and hand the engine its digest.
          install -m 0644 "${trusted_key}" .forge-ci-cosign.pub
          COSIGN_PUBLIC_KEY_PATH=.forge-ci-cosign.pub
          # The digest input is a bare digest; read the first field so a
          # value pasted in sha256sum format does not become the digest.
          read -r COSIGN_PUBLIC_KEY_SHA256 _ <"${trusted_key}.sha256"
          export COSIGN_PUBLIC_KEY_PATH COSIGN_PUBLIC_KEY_SHA256
          # shellcheck source=.engine/bin/lib-forge-ci.sh
          source "${HELPERS_DIR:?}/.engine/bin/lib-forge-ci.sh"
          : "${EXPECTED_REF:?promotion must return an exact digest reference}"
          : "${LEDGER_JSON:?publication must return its original ledger}"
          registry_token=${REGISTRY_TOKEN:?authentication requires RELEASE_REGISTRY_TOKEN}
          export -n registry_token
          unset REGISTRY_TOKEN
          auth_file="${SIGNER_WORKSPACE:?}/registry-auth.json"
          printf '%s' "${registry_token}" | FORGE_CI_PROVIDER=forgejo run_forge_ci container login \
            --registry "${EXPECTED_REPOSITORY}" --server-url "${FORGEJO_SERVER}" --repository "${FORGEJO_REPO}" \
            --registry-username "${REGISTRY_USER:-}" --registry-password-file - --auth-file "${auth_file}"
          unset REGISTRY_USER
          # Authentication of one exact base, never discovery.
          parent=$(FORGE_CI_PROVIDER=forgejo run_forge_ci container base-images authenticate-parent --auth-file "${auth_file}" \
            --expected-ref "${EXPECTED_REF}" --base-inputs-json "${BASE_INPUTS_JSON}")
          printf 'ledger_json=%s\n' "${LEDGER_JSON}" >>"${FORGEJO_OUTPUT:?}"
          printf 'parent_base_json=%s\n' "${parent}" >>"${FORGEJO_OUTPUT:?}"
          # This workflow pushed the staging candidate, so it removes it,
          # now that the final tag is authenticated, with the token that
          # pushed it: the caller holds no registry token for it.
          ledger_file="${SIGNER_WORKSPACE:?}/base-images.ledger.json"
          printf '%s' "${LEDGER_JSON}" >"${ledger_file}"
          FORGEJO_TOKEN="${registry_token}" FORGE_CI_PROVIDER=forgejo run_forge_ci container base-images cleanup \
            --server-url "${FORGEJO_SERVER}" --repository "${FORGEJO_REPO}" --repository-suffix "${REPOSITORY_SUFFIX:-}" \
            --expected-repository "${EXPECTED_REPOSITORY}" --ledger "${ledger_file}" \
            --base-inputs-json "${BASE_INPUTS_JSON}" --auth-file "${auth_file}"
          unset registry_token

      - name: Cleanup signer workspace
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${SIGNER_WORKSPACE:-}" ]; then
            rm -rf "${SIGNER_WORKSPACE}"
          fi
