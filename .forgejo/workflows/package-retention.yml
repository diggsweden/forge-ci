# workflow-call-secrets-contract: RELEASE_REGISTRY_TOKEN

name: GHCR package retention (reusable)
defaults:
  run:
    shell: bash
on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner labels as a JSON array.
        type: string
        required: true
      job-image:
        description: Reviewed digest-pinned image containing the engine and sha256sum.
        type: string
        required: true
      engine-sha256:
        description: Literal checksum of the engine in job-image, from the reviewed engine revision.
        type: string
        required: true
      repository:
        description: One package to prune, as ghcr.io/owner/name. Give this or packages-json, not both.
        type: string
        default: ''
      packages-json:
        description: Reviewed inventory {"include":[{"repository":"ghcr.io/owner/name","digest":"sha256:..."}]}. All rows for one repository are protected together. Give this or repository, not both.
        type: string
        default: ''
      registry-user:
        description: GitHub account the GHCR credential logs in as.
        type: string
        required: true
      keep-tags:
        description: Regular expression of tags kept whatever their age. Empty keeps the engine's default, the release and pre-release tags.
        type: string
        default: ''
      recent-count:
        type: number
        default: 10
      max-delete:
        description: Refuse a package whose deletion set exceeds this limit.
        type: number
        default: 100
      dry-run:
        description: true, the default, only lists what would be deleted. false deletes it; ask for it only after a reviewed preview of the same inputs.
        type: boolean
        default: true
jobs:
  retention:
    runs-on: ${{ fromJSON(inputs['runs-on']) }}
    container: ${{ inputs['job-image'] }}
    # One serial Go pass covers the complete inventory, not one package per job.
    timeout-minutes: 120
    steps:
      - name: Verify the caller-pinned engine bytes
        env:
          EXPECTED_SHA256: ${{ inputs['engine-sha256'] }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SHA256:?}" =~ ^[a-f0-9]{64}$ ]]
          engine=$(command -v forge-ci)
          printf '%s  %s\n' "$EXPECTED_SHA256" "$engine" | sha256sum --check --strict
      - name: Apply the reviewed retention policy
        env:
          REPOSITORY: ${{ inputs['repository'] }}
          PACKAGES_JSON: ${{ inputs['packages-json'] }}
          KEEP_TAGS: ${{ inputs['keep-tags'] }}
          RECENT_COUNT: ${{ inputs['recent-count'] }}
          MAX_DELETE: ${{ inputs['max-delete'] }}
          DRY_RUN: ${{ inputs['dry-run'] }}
          GH_TOKEN: ${{ secrets.RELEASE_REGISTRY_TOKEN }}
          REGISTRY_USER: ${{ inputs['registry-user'] }}
        run: |
          set -euo pipefail
          # Anything but an explicit false previews.
          dry_run=true
          [[ "${DRY_RUN:-}" != false ]] || dry_run=false
          # The CLI refuses neither selector, and both together.
          args=()
          [[ -z "${REPOSITORY:-}" ]] || args+=(--repository "${REPOSITORY}")
          [[ -z "${PACKAGES_JSON:-}" ]] || args+=(--packages-json "${PACKAGES_JSON}")
          [[ -z "${KEEP_TAGS:-}" ]] || args+=(--keep-tags "${KEEP_TAGS}")
          forge-ci container package-retention "${args[@]}" \
            --recent-count "${RECENT_COUNT:?}" --max-delete "${MAX_DELETE:?}" \
            --registry-username "${REGISTRY_USER:?}" --dry-run="${dry_run}"
