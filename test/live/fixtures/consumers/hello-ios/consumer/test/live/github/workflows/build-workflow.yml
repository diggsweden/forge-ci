name: Build Workflow
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The reusable Xcode leaf refuses PR context, including unsigned builds.
  build:
    uses: diggsweden/forge-ci/.github/workflows/build-xcode-ios.yml@v0.90.0
    with:
      forge-ci-sha: v0.90.0
      xcode-version: "26.6"
      runs-on-darwin-arm64: '["macos-26"]'
      project: HelloTrial.xcodeproj
      scheme: HelloTrial
      use-xcodegen: true
      destination: generic/platform=iOS
      enable-code-signing: false
      artifact-name: hello-ios-unsigned
      include-tag: false
