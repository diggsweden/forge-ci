# Signed AAR files only. The default declaration still requests Maven publication.
artifacts:
  - name: hello-android-library
    project-type: gradle-android
    build-type: library
    working-directory: .
    sboms: build
    config:
      build-module: lib
      gradle-version-file: gradle.properties
sign:
  method: gpg
git-signing:
  method: gpg
