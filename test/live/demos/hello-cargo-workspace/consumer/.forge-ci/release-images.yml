# The Forgejo and GitLab releases' runtime images. Both binaries are exported
# by the release's own export jobs; this declaration builds only the two
# runtime images from the same prepared release source, one native build per
# platform the release selects. A release publishes to one repository, so the
# two images are tag variants there: <release tag>-worker and -keytool.
containers:
  - name: hello-worker
    container-file: Containerfile
    context: .
    target: runtime-worker
    tag-suffix: -worker
    platforms: linux/amd64,linux/arm64
  - name: hello-keytool
    container-file: Containerfile
    context: .
    target: runtime-keytool
    tag-suffix: -keytool
    platforms: linux/amd64,linux/arm64
