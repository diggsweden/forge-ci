# The binary is exported by the release's own export jobs; this declaration
# builds only the runtime image from the same prepared release source, one
# native build per platform the release selects.
containers:
  - name: hello-cargo-container
    container-file: Containerfile
    context: .
    target: runtime
    platforms: linux/amd64,linux/arm64
