name: Pull Request Quality Stage
on:
  workflow_call:
    inputs:
      enforce-lint:
        description: "Enforcement setting: false reports lint findings without failing; the checks still run. Set it only in the administrator's entry point, since whoever writes this call can pass it; it is the administrator's only where that file is. See docs/admin-policy.md."
        type: boolean
        required: false
        default: false
      enforce-vulnerabilities:
        description: "Enforcement setting: false reports vulnerability findings without failing; the scans still run. Set it only in the administrator's entry point, since whoever writes this call can pass it; it is the administrator's only where that file is. See docs/admin-policy.md."
        type: boolean
        required: false
        default: false
      pr-plan-json:
        required: true
        type: string
      quality-stage-plan-json:
        required: true
        type: string
      runtime-image:
        description: "Administrator-pinned forge-ci base runtime image@sha256 digest for reporting and the lint jobs' canonical admission"
        required: true
        type: string
      required-lints:
        description: "Mandated lint floor passed to `nanolinter verify --require` (comma-separated check ids forced to run + block)."
        required: false
        default: "secrets"
        type: string
      disable-checks:
        description: "Nanolinter check ids to leave out of the run (comma-separated), passed to `nanolinter verify --disable-check`; it cannot remove a check required-lints names."
        required: false
        default: ""
        type: string
      megalinter-image:
        description: "Required for a planned MegaLinter job: reviewed image reference pinned by @sha256:<64 lowercase hex>"
        required: false
        default: ""
        type: string
      runs-on:
        description: "JSON array of runner labels for the ordinary jobs, read with fromJSON. Signing, promotion and publication jobs stay on GitHub-hosted runners."
        required: false
        default: '["ubuntu-26.04"]'
        type: string
      runs-on-darwin-arm64:
        description: "JSON array of runner labels for the macOS arm64 jobs, read with fromJSON."
        required: false
        default: '["macos-26"]'
        type: string
      forge-ci-binary-ref:
        description: "Full approved engine commit the canonical CLI of this run was built from; the lint jobs receive that build"
        required: true
        type: string
      # Canonical delivery of the same run, forwarded to the lint jobs that
      # run on the runner.
      canonical-artifact-id: {type: string, required: true}
      canonical-artifact-name: {type: string, required: true}
      canonical-producer-run-id: {type: string, required: true}
      canonical-producer-run-attempt: {type: string, required: true}
      canonical-producer-engine-repository: {type: string, required: true}
      canonical-producer-engine-commit: {type: string, required: true}
      canonical-producer-result: {type: string, required: true}
    # Aggregator: forwards CODE_SCANNING_TOKEN to the nanolinter job for
    # its security-SARIF upload; other lint jobs use the auto GITHUB_TOKEN.
    secrets:
      CODE_SCANNING_TOKEN:
        description: "Token with security-events:write for SARIF upload"
        required: false
permissions:
  contents: read
jobs:
  resolve-bootstrap:
    name: "Setup: check quality stage pins"
    permissions:
      contents: read
    uses: ./.github/workflows/resolve-forge-ci-bootstrap.yml
    with:
      job-name: "Setup: check quality stage pins"
      forge-ci-binary-ref: ${{ inputs['forge-ci-binary-ref'] }}
      images: |
        runtime-image=${{ inputs['runtime-image'] }}
  nanolinter:
    needs: [resolve-bootstrap]
    name: Nanolinter
    if: ${{ fromJson(inputs['quality-stage-plan-json']).targets.nanolinter.runs }}
    permissions:
      contents: read
      actions: read # The lint job downloads the canonical CLI.
    secrets:
      CODE_SCANNING_TOKEN: ${{ secrets.CODE_SCANNING_TOKEN }}
    uses: ./.github/workflows/lint-nanolinter.yml
    with:
      runs-on: ${{ inputs['runs-on'] }}
      enforce-lint: ${{ inputs['enforce-lint'] }}
      enforce-vulnerabilities: ${{ inputs['enforce-vulnerabilities'] }}
      # Resolved by `forge-ci plan pr`: the caller's override or the
      # flavour matching the project type.
      nanolinter-image: ${{ fromJson(inputs['pr-plan-json']).policy.nanolinter_image }}
      required-lints: ${{ inputs['required-lints'] }}
      disable-checks: ${{ inputs['disable-checks'] }}
      forge-ci-binary-ref: ${{ inputs['forge-ci-binary-ref'] }}
      runtime-image: ${{ inputs['runtime-image'] }}
      canonical-artifact-id: ${{ inputs['canonical-artifact-id'] }}
      canonical-artifact-name: ${{ inputs['canonical-artifact-name'] }}
      canonical-producer-run-id: ${{ inputs['canonical-producer-run-id'] }}
      canonical-producer-run-attempt: ${{ inputs['canonical-producer-run-attempt'] }}
      canonical-producer-engine-repository: ${{ inputs['canonical-producer-engine-repository'] }}
      canonical-producer-engine-commit: ${{ inputs['canonical-producer-engine-commit'] }}
      canonical-producer-result: ${{ inputs['canonical-producer-result'] }}
  megalinter:
    needs: [resolve-bootstrap]
    name: MegaLinter
    if: ${{ fromJson(inputs['quality-stage-plan-json']).targets.megalinter.runs }}
    permissions:
      contents: read
      actions: read # The lint job downloads the canonical CLI.
    secrets:
      CODE_SCANNING_TOKEN: ${{ secrets.CODE_SCANNING_TOKEN }}
    uses: ./.github/workflows/lint-megalinter.yml
    with:
      runs-on: ${{ inputs['runs-on'] }}
      megalinter-image: ${{ inputs['megalinter-image'] }}
      forge-ci-binary-ref: ${{ inputs['forge-ci-binary-ref'] }}
      runtime-image: ${{ inputs['runtime-image'] }}
      canonical-artifact-id: ${{ inputs['canonical-artifact-id'] }}
      canonical-artifact-name: ${{ inputs['canonical-artifact-name'] }}
      canonical-producer-run-id: ${{ inputs['canonical-producer-run-id'] }}
      canonical-producer-run-attempt: ${{ inputs['canonical-producer-run-attempt'] }}
      canonical-producer-engine-repository: ${{ inputs['canonical-producer-engine-repository'] }}
      canonical-producer-engine-commit: ${{ inputs['canonical-producer-engine-commit'] }}
      canonical-producer-result: ${{ inputs['canonical-producer-result'] }}
  swift:
    needs: [resolve-bootstrap]
    name: Swift checks
    if: ${{ fromJson(inputs['quality-stage-plan-json']).targets.swift.runs }}
    permissions:
      contents: read
    uses: ./.github/workflows/lint-swift.yml
    with:
      runs-on: ${{ inputs['runs-on'] }}
      runs-on-darwin-arm64: ${{ inputs['runs-on-darwin-arm64'] }}
      enforce-lint: ${{ inputs['enforce-lint'] }}
      forge-ci-binary-ref: ${{ inputs['forge-ci-binary-ref'] }}
      enable-swiftformat: ${{ fromJson(inputs['pr-plan-json']).policy.swift_format }}
      enable-swiftlint: ${{ fromJson(inputs['pr-plan-json']).policy.swift_lint }}
      runtime-image: ${{ inputs['runtime-image'] }}
  summarize-quality-stage:
    name: PR check results
    needs: [resolve-bootstrap, nanolinter, megalinter, swift]
    if: ${{ !cancelled() && needs.resolve-bootstrap.result == 'success' }}
    runs-on: ${{ fromJSON(inputs['runs-on']) }}
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require original canonical success and approved identity
        shell: /bin/bash --noprofile --norc -peuo pipefail {0}
        env:
          ENGINE_REPOSITORY: ${{ needs.resolve-bootstrap.outputs.forge-ci-repository }}
          ENGINE_COMMIT: ${{ inputs['forge-ci-binary-ref'] }}
          ENGINE_ORIGIN: ${{ github.server_url }}/${{ needs.resolve-bootstrap.outputs.forge-ci-repository }}
          RUNTIME_IMAGE: ${{ inputs['runtime-image'] }}
          PRODUCER_ARTIFACT_ID: ${{ inputs['canonical-artifact-id'] }}
          PRODUCER_ARTIFACT_NAME: ${{ inputs['canonical-artifact-name'] }}
          PRODUCER_RUN_ID: ${{ inputs['canonical-producer-run-id'] }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs['canonical-producer-run-attempt'] }}
          PRODUCER_ENGINE_REPOSITORY: ${{ inputs['canonical-producer-engine-repository'] }}
          PRODUCER_ENGINE_COMMIT: ${{ inputs['canonical-producer-engine-commit'] }}
          CANONICAL_PRODUCER_RESULT: ${{ inputs['canonical-producer-result'] }}
        run: |
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANONICAL_PRODUCER_RESULT" == success && "$PRODUCER_RUN_ID" == "$GITHUB_RUN_ID" && "$PRODUCER_RUN_ATTEMPT" == "$GITHUB_RUN_ATTEMPT" ]]
          [[ "$ENGINE_REPOSITORY" =~ ^[A-Za-z0-9_-][A-Za-z0-9_.-]*/[A-Za-z0-9_-][A-Za-z0-9_.-]*$ && "$ENGINE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PRODUCER_ENGINE_REPOSITORY" == "$ENGINE_REPOSITORY" && "$PRODUCER_ENGINE_COMMIT" == "$ENGINE_COMMIT" ]]
          [[ "$PRODUCER_ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$PRODUCER_ARTIFACT_NAME" == "forge-ci-canonical-linux-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ENGINE_COMMIT" ]]
          [[ "$RUNTIME_IMAGE" =~ ^[a-z0-9][a-z0-9./:_-]*@sha256:[0-9a-f]{64}$ ]]
          [[ "$GITHUB_SERVER_URL" =~ ^https://[^/?#@[:space:]]+$ && "$ENGINE_ORIGIN" == "$GITHUB_SERVER_URL/$ENGINE_REPOSITORY" ]]
          for variable in ENGINE_REPOSITORY ENGINE_COMMIT ENGINE_ORIGIN RUNTIME_IMAGE PRODUCER_ARTIFACT_ID PRODUCER_ARTIFACT_NAME PRODUCER_RUN_ID PRODUCER_RUN_ATTEMPT PRODUCER_ENGINE_REPOSITORY PRODUCER_ENGINE_COMMIT CANONICAL_PRODUCER_RESULT; do
            printf '%s=%s\n' "$variable" "${!variable}" >>"$GITHUB_ENV"
          done
      - name: Checkout only the approved engine before consumer or private steps
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ env.ENGINE_REPOSITORY }}
          ref: ${{ env.ENGINE_COMMIT }}
          path: _forge_ci_bootstrap
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Consume canonical CLI from the independently pinned engine checkout
        id: canonical-bootstrap
        uses: ./_forge_ci_bootstrap/.github/actions/consume-canonical-cli
        with:
          tool-profile: runtime
      - name: Normalize PR quality stage result
        id: summary
        env:
          STAGE_PLAN_JSON: ${{ inputs['quality-stage-plan-json'] }}
          JOB_RESULTS: ${{ toJson(needs) }}
        run: forge-ci report stage-result
      # History only, for the commit list of the overview: no file of the
      # change is checked out and nothing from it runs. A failure here leaves
      # the list out and nothing else.
      - name: Fetch the commit history of the change
        if: ${{ !cancelled() && steps.canonical-bootstrap.outputs.verified == 'true' && github.event.pull_request.base.sha != '' }}
        continue-on-error: true
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: _pr_history
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: .forge-ci-history-only
          sparse-checkout-cone-mode: false
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Write PR check results
        if: ${{ !cancelled() && steps.canonical-bootstrap.outputs.verified == 'true' && (steps.summary.outcome == 'success' || steps.summary.outcome == 'failure') }}
        env:
          PR_COMPACT: 'true'
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_TARGET_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          PR_TARGET_BRANCH: ${{ github.base_ref }}
          PR_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          PR_COMMITS_BASE: ${{ github.event.pull_request.base.sha }}
          PR_COMMITS_CHECKOUT: _pr_history
          CI_BRANCH: ${{ github.head_ref || github.ref_name }}
          CI_RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          PR_NANOLINTER_JOB_URL: ${{ needs.nanolinter.outputs.job-url }}
          PR_RESULTS_UNAVAILABLE: ${{ steps.summary.outcome == 'failure' }}
          QUALITY_STAGE_RESULT_PATH: ${{ steps.summary.outcome == 'success' && '.ci-results/pr-quality-result.json' || '' }}
        run: forge-ci report pr
      - name: Upload quality stage manifests
        if: ${{ !cancelled() && steps.summary.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-results-pr-quality
          path: .ci-results/*.json
          include-hidden-files: "true"
          retention-days: "5"
          if-no-files-found: ignore
