# Include this component from a pinned, independently controlled CI policy.
# The resource group stays locked through the mirrored child pipeline, covering
# preparation, signing, promotion and publication across concurrent releases.
spec:
  component: [sha, reference]
  inputs:
    release-policy:
      description: Accepted release versions; classification comes from the signed tag.
      default: stable
      options: [stable, stable-prerelease]
    forge-ci-repository:
      regex: '^[A-Za-z0-9_][A-Za-z0-9_.-]*(/[A-Za-z0-9_][A-Za-z0-9_.-]*)+$'
    consumer-project:
      regex: '^[A-Za-z0-9_][A-Za-z0-9_.-]*(/[A-Za-z0-9_][A-Za-z0-9_.-]*)+$'
    server-url:
      description: >-
        This GitLab instance's URL as CI_SERVER_URL reads, https://host[:port] without a path, for example https://gitlab.example.com. The release tokens go only there: each job refuses to run when CI_SERVER_URL, which a project or pipeline variable can set, differs.
      regex: '^https://[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?(:[0-9]{1,5})?$'
    registry:
      description: >-
        This instance's container registry as CI_REGISTRY reads, host[:port], for example registry.gitlab.example.com, or empty when the project has none. GitLab configures it apart from the web host, so it is stated, not derived; each job refuses to run when CI_REGISTRY differs, and the images go to it.
      regex: '^$|^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?(:[0-9]{1,5})?$'
    job-image:
      description: Tools for consumer checks and changelog rendering, run as an ordinary user (see job-user).
      regex: '^[^[:space:]]+@sha256:[0-9a-f]{64}$'
    job-user:
      description: UID or UID:GID the job-image jobs run as, such as 65532:65532 for the runtime images' nonroot user; empty keeps the image's own user.
      regex: '^$|^(0|[1-9][0-9]*)(:(0|[1-9][0-9]*))?$'
      default: ''
    build-image:
      description: Consumer build tools; may match job-image when no separate builder is needed.
      regex: '^[^[:space:]]+@sha256:[0-9a-f]{64}$'
    signer-image:
      regex: '^[^[:space:]]+@sha256:[0-9a-f]{64}$'
    publication-project:
      regex: '^[A-Za-z0-9_][A-Za-z0-9_.-]*(/[A-Za-z0-9_][A-Za-z0-9_.-]*)+$'
    publication-image-repository:
      description: The registry repository in publication-project that receives final images, without tag or digest.
      regex: '^[^[:space:]''@]+$'
    cosign-public-key-sha256:
      regex: '^[0-9a-f]{64}$'
    release-git-url:
      regex: '^[^[:space:]'']*$'
      default: ''
    release-git-host-key-fingerprint:
      description: The SSH host key fingerprint of release-git-url's host, SHA256:<base64> alone.
      regex: '^SHA256:[A-Za-z0-9+/]{43}=?$'
    request-allowed-signers:
      description: OpenSSH allowed-signers text of the people who may sign a release request, without a single quote, since the jobs quote it in their script.
      regex: '\A[^'']+\z'
    bot-name:
      regex: '^[^''[:cntrl:]]+$'
    bot-email:
      regex: '^[^''[:space:]]+@[^''[:space:]]+$'
    checks:
      type: array
    checks-runner-tags:
      description: Runner tags for consumer checks after restricted signed-request authorization. Empty leaves checks untagged. Select stronger capacity only for trusted checks requiring it.
      type: array
      default: []
    build:
      type: array
    build-runner-tags:
      description: >-
        Runner tags for the build job and, with buildah, the amd64 image job, for example [privileged] where only a tagged runner lets an image build enter user namespaces. Request authorization and signing stay on untagged runners. Empty, the default, leaves them untagged.
      type: array
      default: []
    release-images:
      description: >-
        Build the containers artifacts-config declares in the release's image jobs, scan them, stage them in this project's registry and hand them to signing. The build leaves files the Containerfiles copy that are not in the repository in image-context/. Without artifacts.yml the root Containerfile is the image.
      type: boolean
      default: false
    artifacts-config:
      description: Path of the artifacts.yml declaring the containers. Empty reads .forge-ci/artifacts.yml.
      regex: '^$|^[A-Za-z0-9_.][A-Za-z0-9_./-]*$'
      default: ''
    release-platforms:
      description: Comma-separated subset of each container's platforms to build and export, for example linux/amd64. Empty builds each container's declared platforms, linux/amd64 when it declares none, and exports linux/amd64.
      regex: '^$|^linux/(amd64|arm64)(,linux/(amd64|arm64))?$'
      default: ''
    labels:
      description: >-
        Newline-separated key=value labels every release image carries, for example org.opencontainers.image.licenses=MIT. forge-ci sets source, revision, title, version, url, documentation, ref.name and created from the release; a label naming one of them is refused at the release request, as labels without release-images is. Values are single lines without quotes.
      regex: '^$|^[a-z0-9]+([._-][a-z0-9]+)*=[^''[:cntrl:]]+(\n[a-z0-9]+([._-][a-z0-9]+)*=[^''[:cntrl:]]+)*\n?$'
      default: ''
    image-builder:
      description: >-
        Image builder of the image jobs, which run in builder-job-image: buildah, the default, on the build-runner-tags runner, or kaniko on an ordinary runner, for runners that deny the user namespaces Buildah needs.
      options: [buildah, kaniko]
      default: buildah
    builder-job-image:
      description: The digest-pinned job image of the image builder, containers/buildah-job or, admitted, containers/kaniko-job. Required with release-images.
      regex: '^$|^[^[:space:]]+@sha256:[0-9a-f]{64}$'
      default: ''
    build-runner-tags-arm64:
      description: Runner tags of a native arm64 runner for the arm64 image builds. Empty, the default, builds no arm64 image; a container that declares linux/arm64 then needs release-platforms narrowed.
      type: array
      default: []
    export-files:
      description: >-
        Run the export commands before the build job: once per selected architecture (release-platforms; empty is linux/amd64, and a container that declares linux/arm64 then needs release-platforms named), natively on that architecture's runner, in builder-job-image with image-builder, on the release commit and with no credential of the job. Each job's dist/ is laid into the build job's dist/ before the build commands run. Requires builder-job-image.
      type: boolean
      default: false
    export:
      description: >-
        Commands that export files from a Containerfile stage into dist/, for example `forge-ci container build --mode local --platform "$EXPORT_PLATFORM" --output-dir "dist/linux-$EXPORT_ARCH"`. EXPORT_PLATFORM and EXPORT_ARCH name the job's architecture. Set export-files with them; without it they are refused. No single quote.
      type: array
      default: []
    changelog-creator:
      default: git-cliff
      options: [git-chglog, git-cliff]
    changelog-config:
      description: Consumer config used by the selected changelog renderer.
      default: .forge-ci/gitcliff/keepachangelog.toml
      regex: '^[A-Za-z0-9_.][A-Za-z0-9_./-]*$'
    commit-body-config:
      description: Consumer config used to render the release commit body.
      default: .forge-ci/gitcliff/minimal.toml
      regex: '^[A-Za-z0-9_.][A-Za-z0-9_./-]*$'
    sign-distro-packages:
      type: boolean
      default: true
    release-asset-retention:
      description: >-
        How many of the newest releases keep every file. After publishing, each older release keeps its checksums, signatures and SBOMs and loses its archives, binaries and packages, upload and link both; the releases and tags stay. Empty, the default, deletes nothing.
      regex: '^$|^[1-9][0-9]*$'
      default: ''
    base-images:
      description: Import, sign and publish newly built content-addressed bases in the publication project's bases repository.
      type: boolean
      default: false
    transparency-log:
      description: >-
        Whether Cosign signatures are also written to the public Sigstore transparency log. `none`, the default, writes no entry and contacts no Sigstore service: a signature is then verified against the key alone. `public` writes every signature to the public log, Rekor, permanently. Every release of one organization takes the same value, because a signature is verified the way it was made.
      default: none
      options: [none, public]
    version-bump:
      description: >-
        Project type whose project files the signed release commit bumps to the release version: maven, npm, cargo, or empty (the default) for no bump. A job that holds no release credential runs the project's build tool in job-image and hands over the patch; release-prepare verifies it as data and applies it, without running project code. npm/Cargo lockfiles must remain consistent and other document fields cannot change.
      default: ''
      options: ['', maven, npm, cargo]
    release-branch:
      description: >-
        Branch a release lands on. The release request must be its head, and the release commit is pushed to it. Empty, the default, takes the project's default branch.
      default: ''
      regex: '^$|^[A-Za-z0-9_][A-Za-z0-9_./-]*$'
    enforce-lint:
      type: boolean
      default: true
      description: >-
        Enforcement setting, applied by the forge-ci of the checks and build jobs: false reports lint findings without failing. The checks still run. See docs/admin-policy.md.
    enforce-vulnerabilities:
      type: boolean
      default: true
      description: >-
        Enforcement setting, applied by the forge-ci of the checks and build jobs: false reports vulnerability findings without failing.
    enforce-application-tests:
      type: boolean
      default: true
      description: >-
        Enforcement setting, applied by the forge-ci of the checks and build jobs: false reports recognized test assertion failures without failing. Tests still run.
    enforce-reproducible-builds:
      type: boolean
      default: true
      description: >-
        Enforcement setting, applied by the forge-ci of the checks and build jobs: false reports missing reproducible-build settings without failing.
---
release:
  stage: deploy
  resource_group: release
  interruptible: false
  inherit:
    variables: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^release-request\/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/'
  trigger:
    strategy: mirror
    forward:
      yaml_variables: false
      pipeline_variables: false
    include:
      - project: $[[ inputs.forge-ci-repository ]]
        ref: $[[ component.sha ]]
        file: /templates/release-jobs.yml
        inputs:
          release-policy: $[[ inputs.release-policy ]]
          engine-sha: $[[ component.sha ]]
          engine-reference: $[[ component.reference ]]
          forge-ci-repository: $[[ inputs.forge-ci-repository ]]
          consumer-project: $[[ inputs.consumer-project ]]
          server-url: $[[ inputs.server-url ]]
          registry: $[[ inputs.registry ]]
          job-image: $[[ inputs.job-image ]]
          job-user: $[[ inputs.job-user ]]
          build-image: $[[ inputs.build-image ]]
          signer-image: $[[ inputs.signer-image ]]
          publication-project: $[[ inputs.publication-project ]]
          publication-image-repository: $[[ inputs.publication-image-repository ]]
          cosign-public-key-sha256: $[[ inputs.cosign-public-key-sha256 ]]
          release-git-url: $[[ inputs.release-git-url ]]
          release-git-host-key-fingerprint: $[[ inputs.release-git-host-key-fingerprint ]]
          request-allowed-signers: $[[ inputs.request-allowed-signers ]]
          bot-name: $[[ inputs.bot-name ]]
          bot-email: $[[ inputs.bot-email ]]
          checks: $[[ inputs.checks ]]
          checks-runner-tags: $[[ inputs.checks-runner-tags ]]
          build: $[[ inputs.build ]]
          build-runner-tags: $[[ inputs.build-runner-tags ]]
          release-images: $[[ inputs.release-images ]]
          artifacts-config: $[[ inputs.artifacts-config ]]
          release-platforms: $[[ inputs.release-platforms ]]
          labels: $[[ inputs.labels ]]
          image-builder: $[[ inputs.image-builder ]]
          builder-job-image: $[[ inputs.builder-job-image ]]
          build-runner-tags-arm64: $[[ inputs.build-runner-tags-arm64 ]]
          export-files: $[[ inputs.export-files ]]
          export: $[[ inputs.export ]]
          changelog-creator: $[[ inputs.changelog-creator ]]
          changelog-config: $[[ inputs.changelog-config ]]
          commit-body-config: $[[ inputs.commit-body-config ]]
          sign-distro-packages: $[[ inputs.sign-distro-packages ]]
          release-asset-retention: $[[ inputs.release-asset-retention ]]
          base-images: $[[ inputs.base-images ]]
          transparency-log: $[[ inputs.transparency-log ]]
          release-branch: $[[ inputs.release-branch ]]
          version-bump: $[[ inputs.version-bump ]]
          enforce-lint: $[[ inputs.enforce-lint ]]
          enforce-vulnerabilities: $[[ inputs.enforce-vulnerabilities ]]
          enforce-application-tests: $[[ inputs.enforce-application-tests ]]
          enforce-reproducible-builds: $[[ inputs.enforce-reproducible-builds ]]
