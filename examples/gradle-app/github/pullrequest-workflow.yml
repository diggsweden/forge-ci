name: Pull Request Workflow

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-checks:
    uses: diggsweden/forge-ci/.github/workflows/pullrequest-orchestrator.yml@v0.90.0
    secrets:
      # Optional: uploads lint security findings (SARIF) to Code Scanning.
      CODE_SCANNING_TOKEN: ${{ secrets.CODE_SCANNING_TOKEN }}
    permissions:
      actions: read
      contents: read
    with:
      forge-ci-binary-ref: v0.90.0
      project-type: gradle
      # The lint image, pinned by digest: the plan job refuses a tag.
      nanolinter-image: ghcr.io/itiquette/nanolinter:kotlin@sha256:PIN_DIGEST
      # Default lint engine: nanolinter (runs `nanolinter verify` from your nanolinter.toml)
      lint-engine: nanolinter
      # The runtime images of the release you call, pinned with it; left
      # out, the release resolves the same ones.
      runtime-image: ghcr.io/diggsweden/forge-ci-runtime-base:v0.90.0

  # Your tests. The orchestrator above never runs them; require this job and
  # pr-checks as status checks.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - run: ./gradlew test
