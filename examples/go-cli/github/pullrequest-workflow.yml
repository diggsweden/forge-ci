name: Pull Request Workflow

# This workflow runs the forge-ci lint and security checks, and your Go tests
# in the test job below. Require both jobs as status checks before merging.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-checks:
    name: Quality checks
    uses: diggsweden/forge-ci/.github/workflows/pullrequest-orchestrator.yml@PIN_FORGE_CI_SHA # v0.90.0
    secrets:
      # Optional: uploads lint security findings (SARIF) to Code Scanning.
      CODE_SCANNING_TOKEN: ${{ secrets.CODE_SCANNING_TOKEN }}
    permissions:
      actions: read
      contents: read
    with:
      # The full commit the uses: ref above names; every job of the route runs
      # only the CLI this commit records.
      forge-ci-sha: PIN_FORGE_CI_SHA # v0.90.0
      project-type: go
      # The lint image, pinned by digest: the plan job refuses a tag.
      nanolinter-image: ghcr.io/itiquette/nanolinter:go@sha256:PIN_DIGEST
      lint-engine: nanolinter
      # Pinned by digest and admitted before any job runs; fill in the
      # digest of the release you call (docs/runtime-images.md). The jobs run
      # the Forge CI this image carries, checked against the commit above.
      runtime-image: ghcr.io/diggsweden/forge-ci-runtime-base@sha256:PIN_BASE_IMAGE_DIGEST # v0.90.0 digest

  # Your tests. The orchestrator above never runs them; require this job and
  # pr-checks as status checks. Add govulncheck or your own policy here.
  test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
