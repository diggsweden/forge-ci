name: Release Workflow

# Runs when you push a signed release-request/vX.Y.Z tag; the release creates
# the final vX.Y.Z tag, never you. Before the first run, set the secrets your
# artifacts.yml signing method needs (the block below names them) and follow
# https://github.com/diggsweden/forge-ci/blob/main/docs/github.md#getting-started
# changelog-creator and release-publisher name the tools; an empty value skips
# that step. release.attachartifacts selects the files the release lists.
on:
  push:
    tags:
      - "release-request/v*"
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    uses: diggsweden/forge-ci/.github/workflows/release-orchestrator.yml@v0.90.0
    permissions:
      contents: write
      packages: write
      # id-token: write is required for Sigstore-keyless signing.
      id-token: write
      actions: read
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      # Signs the release commit and tag (git-signing.method: ssh).
      RELEASE_SSH_SIGNING_KEY: ${{ secrets.RELEASE_SSH_SIGNING_KEY }}
    with:
      branch: main
      forge-ci-binary-ref: v0.90.0
      artifacts-config: .forge-ci/artifacts.yml
      changelog-creator: git-cliff
      release-publisher: github-cli
      # SSH Git signing needs the bot's identity: an SSH key carries none.
      # bot-email is the signing principal, and must match the line for the
      # public half of RELEASE_SSH_SIGNING_KEY in .forge-ci/allowed_signers.
      bot-name: FIXME Release Bot
      bot-email: FIXME-release-bot@example.com
      release.attachartifacts: release-artifacts/*/my-cli-*
