# Copy into a Forge CI mirror's .forgejo/workflows/ after configuring its
# registry namespace, reviewed signer image, public-key digest and native runners.
# Replace FORGE_CI_COMMIT with a published immutable revision containing these
# actions and matching engine binaries before enabling this example.
name: Runtime images
on:
  push:
    branches: [main]
    paths:
      - containers/runtime/**
      - scripts/bootstrap/**
      - templates/**
      - scripts/ci/runtime-*.sh
      - scripts/ci/engine-binary.sh
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - .engine/bin/*.sha256
      - .forgejo/workflows/runtime-images.yml
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:
concurrency:
  group: runtime-images-${{ forgejo.repository }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  FORGE_CI_PROVIDER: forgejo
  FORGEJO_SERVER: ${{ forgejo.server_url }}
  FORGEJO_REPO: ${{ forgejo.repository }}
  SOURCE_SHA: ${{ forgejo.sha }}
  RUNTIME_IMAGE_NAMESPACE: ${{ vars.RUNTIME_IMAGE_NAMESPACE }}
  GIT_DEFAULT_HASH: sha1
jobs:
  plan:
    if: forgejo.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABEL) }}
    container: ${{ vars.CI_SIGNER_IMAGE }}
    timeout-minutes: 10
    outputs:
      build-matrix: ${{ steps.plan.outputs.build-matrix }}
      image-matrix: ${{ steps.plan.outputs.image-matrix }}
      candidate-tag: ${{ steps.plan.outputs.candidate-tag }}
      run-id: ${{ steps.plan.outputs.run-id }}
      platform-matrix: ${{ steps.platforms.outputs.matrix-json }}
    steps:
      - uses: https://forge.example/owner/forge-ci/.forgejo/actions/setup-forge-ci@FORGE_CI_COMMIT
      - run: forge-ci platform checkout --object-format sha1 --depth 1
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
      - name: Select native architectures with the shared planner
        id: platforms
        env:
          # Empty selects both declared architectures; a repository may narrow it.
          RELEASE_PLATFORMS: ${{ vars.RELEASE_PLATFORMS }}
        run: forge-ci container platform-plan --platforms linux/amd64,linux/arm64 --release-platforms "$RELEASE_PLATFORMS"
      - name: Plan native runtime builds
        id: plan
        env:
          PUBLICATION_REF: ${{ forgejo.ref }}
          RUNTIME_RUN_ID: ${{ forgejo.run_id }}-${{ forgejo.run_attempt || 1 }}
          REGISTRY_USER: ${{ vars.RELEASE_REGISTRY_USER }}
          PLATFORM_MATRIX: ${{ steps.platforms.outputs.matrix-json }}
        run: |
          set -euo pipefail
          : "${REGISTRY_USER:?Set RELEASE_REGISTRY_USER for GHCR publication}"
          bash scripts/ci/runtime-images.sh plan
          printf 'run-id=%s\n' "$RUNTIME_RUN_ID" >>"$FORGEJO_OUTPUT"
  build-cli:
    needs: plan
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABEL) }}
    container: ${{ vars.CI_GO_BUILD_IMAGE }}
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - uses: https://forge.example/owner/forge-ci/.forgejo/actions/setup-forge-ci@FORGE_CI_COMMIT
      - run: forge-ci platform checkout --object-format sha1 --depth 1
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
      - name: Independently rebuild the recorded CLI bytes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          export GOMODCACHE="${RUNNER_TEMP:?}/runtime-modules" GOCACHE="${RUNNER_TEMP:?}/runtime-go-cache"
          go mod download
          mkdir -p runtime-cli
          for arch in amd64 arm64; do
            bash scripts/ci/engine-binary.sh build "$arch" "$PWD/runtime-cli/forge-ci-$arch"
            bash scripts/ci/runtime-images.sh stage-cli "$arch"
          done
          forge-ci artifact upload --name runtime-cli --dir runtime-cli/ --retention-days 1 --if-no-files error
  request-runner:
    needs: [plan, build-cli]
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABEL) }}
    container: ${{ vars.CI_SIGNER_IMAGE }}
    timeout-minutes: 20
    steps:
      - uses: https://forge.example/owner/forge-ci/.forgejo/actions/setup-forge-ci@FORGE_CI_COMMIT
      - name: Request an ephemeral runner when configured
        env:
          CI_RUNNER_LENDER: ${{ vars.CI_RUNNER_LENDER }}
          CI_RUNNER_LENDER_REPOSITORY: ${{ vars.CI_RUNNER_LENDER_REPOSITORY }}
          CI_RUNNER_LENDER_TOKEN: ${{ secrets.CI_RUNNER_LENDER_TOKEN }}
          BUILD_MATRIX_JSON: ${{ needs.plan.outputs.build-matrix }}
        run: |
          set -euo pipefail
          lender_token=$CI_RUNNER_LENDER_TOKEN
          export -n lender_token
          unset CI_RUNNER_LENDER_TOKEN
          # Each lent runner is single-use: request one per build leg. The
          # shared engine makes this a no-op when lending is not configured.
          requests=$(jq -er '.include[].arch' <<<"$BUILD_MATRIX_JSON")
          while read -r arch; do
            printf '%s' "$lender_token" | forge-ci platform request-runner --arch "$arch" --token-file -
          done <<<"$requests"
  build:
    needs: [plan, build-cli, request-runner]
    runs-on: ${{ fromJSON(vars[matrix.arch == 'arm64' && 'CI_RUNNER_LABEL_CONTAINER_ARM64' || 'CI_RUNNER_LABEL_CONTAINER'] || vars[matrix.arch == 'arm64' && 'CI_RUNNER_LABEL_ARM64' || 'CI_RUNNER_LABEL']) }}
    container: ${{ vars.CI_IMAGE_BUILDER_JOB_IMAGE }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Let the selected pool bound concurrency. A fixed low matrix cap can
      # leave already-lent single-use runners idle until their lease expires.
      matrix: ${{ fromJSON(needs.plan.outputs.build-matrix) }}
    env:
      RUNTIME_RUN_ID: ${{ needs.plan.outputs.run-id }}
      PLATFORM_MATRIX: ${{ needs.plan.outputs.platform-matrix }}
      CI_IMAGE_BUILDER: ${{ vars.CI_IMAGE_BUILDER || 'buildah' }}
      CI_IMAGE_BUILDER_JOB_IMAGE: ${{ vars.CI_IMAGE_BUILDER_JOB_IMAGE }}
    steps:
      - uses: https://forge.example/owner/forge-ci/.forgejo/actions/setup-forge-ci@FORGE_CI_COMMIT
      - run: forge-ci platform checkout --object-format sha1 --depth 1
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
      - run: forge-ci artifact download --name runtime-cli --dir runtime-cli/
      - name: Stage this architecture's verified CLI
        env:
          ARCH: ${{ matrix.arch }}
        run: bash scripts/ci/runtime-images.sh stage-cli "$ARCH"
      - uses: https://forge.example/owner/forge-ci/.forgejo/actions/setup-image-builder@FORGE_CI_COMMIT
        with:
          extra-packages: jq
      - uses: https://forge.example/owner/forge-ci/.forgejo/actions/registry-login@FORGE_CI_COMMIT
        with:
          registry: ghcr.io
          username: ${{ vars.RELEASE_REGISTRY_USER }}
          token: ${{ secrets.RELEASE_REGISTRY_TOKEN }}
          create-auth-file: 'true'
          export-env: 'true'
      - name: Build and publish architecture candidate
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: bash scripts/ci/runtime-images.sh build "$TARGET" "$ARCH"
      - name: Remove registry credentials
        if: always()
        run: test -z "${REGISTRY_AUTH_FILE:-}" || rm -f -- "$REGISTRY_AUTH_FILE"
  collect:
    needs: [plan, build]
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABEL) }}
    container: ${{ vars.CI_SIGNER_IMAGE }}
    timeout-minutes: 10
    outputs:
      smoke-matrix: ${{ steps.collect.outputs.smoke-matrix }}
    env:
      RUNTIME_RUN_ID: ${{ needs.plan.outputs.run-id }}
      PLATFORM_MATRIX: ${{ needs.plan.outputs.platform-matrix }}
    steps:
      - uses: https://forge.example/owner/forge-ci/.forgejo/actions/setup-forge-ci@FORGE_CI_COMMIT
      - run: forge-ci platform checkout --object-format sha1 --depth 1
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
      - id: collect
        run: bash scripts/ci/runtime-images.sh collect
  request-smoke-runner:
    needs: collect
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABEL) }}
    container: ${{ vars.CI_SIGNER_IMAGE }}
    timeout-minutes: 20
    steps:
      - uses: https://forge.example/owner/forge-ci/.forgejo/actions/setup-forge-ci@FORGE_CI_COMMIT
      - name: Request fresh smoke runners when ARM64 uses the build pool
        if: vars.CI_RUNNER_LABEL_ARM64 == ''
        env:
          CI_RUNNER_LENDER: ${{ vars.CI_RUNNER_LENDER }}
          CI_RUNNER_LENDER_REPOSITORY: ${{ vars.CI_RUNNER_LENDER_REPOSITORY }}
          CI_RUNNER_LENDER_TOKEN: ${{ secrets.CI_RUNNER_LENDER_TOKEN }}
          SMOKE_MATRIX_JSON: ${{ needs.collect.outputs.smoke-matrix }}
        run: |
          set -euo pipefail
          lender_token=$CI_RUNNER_LENDER_TOKEN
          export -n lender_token
          unset CI_RUNNER_LENDER_TOKEN
          requests=$(jq -r '.include[] | select(.arch == "arm64") | .arch' <<<"$SMOKE_MATRIX_JSON")
          if [[ -n "$requests" ]]; then
            while read -r arch; do
              printf '%s' "$lender_token" | forge-ci platform request-runner --arch "$arch" --token-file -
            done <<<"$requests"
          fi
  smoke:
    needs: [collect, request-smoke-runner]
    runs-on: ${{ fromJSON(vars[matrix.arch == 'arm64' && 'CI_RUNNER_LABEL_ARM64' || 'CI_RUNNER_LABEL'] || vars[matrix.arch == 'arm64' && 'CI_RUNNER_LABEL_CONTAINER_ARM64' || 'CI_RUNNER_LABEL_CONTAINER']) }}
    # Run the exact candidate digest as a native job container. No nested
    # Podman/user namespaces are needed. Credentials are consumed
    # by the runner for the pull, not exported to the smoke-test process.
    container:
      image: ${{ matrix.ref }}
      credentials:
        username: ${{ vars.RELEASE_REGISTRY_USER }}
        password: ${{ secrets.RELEASE_REGISTRY_TOKEN }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Borrowed smoke runners are single-use too; let their pool bound concurrency.
      matrix: ${{ fromJSON(needs.collect.outputs.smoke-matrix) }}
    steps:
      - name: Check the installed CLI for smoke-test diagnostics
        env:
          EXPECTED_SHA256: ${{ matrix.checksum }}
        run: |
          set -euo pipefail
          printf '%s  /usr/local/bin/forge-ci\n' "$EXPECTED_SHA256" | sha256sum --check --strict
      - run: forge-ci platform checkout --object-format sha1 --depth 1
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
      - name: Exercise the native runtime toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          go_version=$(sed -n 's/^ARG GO_VERSION=//p' containers/runtime/Containerfile)
          bash scripts/ci/runtime-smoke.sh "$TARGET" "$go_version"
      - name: Record the digest that passed native smoke checks
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          TESTED_REF: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          mkdir -p smoke-receipt
          jq -n --arg source "$SOURCE_SHA" --arg target "$TARGET" \
            --arg arch "$ARCH" --arg ref "$TESTED_REF" \
            '{source:$source,target:$target,arch:$arch,ref:$ref}' >smoke-receipt/receipt.json
          forge-ci artifact upload --name "runtime-smoke-$TARGET-$ARCH" \
            --dir smoke-receipt --retention-days 30 --if-no-files error
  assemble:
    needs: [plan, smoke]
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABEL) }}
    container: ${{ vars.CI_SIGNER_IMAGE }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.image-matrix) }}
    env:
      RUNTIME_RUN_ID: ${{ needs.plan.outputs.run-id }}
      PLATFORM_MATRIX: ${{ needs.plan.outputs.platform-matrix }}
    steps:
      - uses: https://forge.example/owner/forge-ci/.forgejo/actions/setup-forge-ci@FORGE_CI_COMMIT
      - run: forge-ci platform checkout --object-format sha1 --depth 1
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
      - uses: https://forge.example/owner/forge-ci/.forgejo/actions/registry-login@FORGE_CI_COMMIT
        with:
          registry: ghcr.io
          username: ${{ vars.RELEASE_REGISTRY_USER }}
          token: ${{ secrets.RELEASE_REGISTRY_TOKEN }}
          create-auth-file: 'true'
          export-env: 'true'
      - name: Assemble tested candidates and record native evidence
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          source scripts/bootstrap/install-trivy.sh
          install_trivy
          bash scripts/ci/runtime-images.sh assemble "$TARGET"
      - name: Remove registry credentials
        if: always()
        run: test -z "${REGISTRY_AUTH_FILE:-}" || rm -f -- "$REGISTRY_AUTH_FILE"
  sign:
    needs: [plan, assemble]
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABEL) }}
    container: ${{ vars.CI_SIGNER_IMAGE }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.image-matrix) }}
    env:
      TARGET: ${{ matrix.target }}
      IMAGE_REPOSITORY: ${{ vars.RUNTIME_IMAGE_NAMESPACE }}/${{ matrix.name }}
      ARCHS_JSON: ${{ toJSON(matrix.archs) }}
      CANDIDATE_TAG: ${{ needs.plan.outputs.candidate-tag }}
      FORGE_CI_COSIGN_TRANSPARENCY: none
    # No source checkout, tool install or candidate execution in this job.
    steps:
      - uses: https://forge.example/owner/forge-ci/.forgejo/actions/setup-forge-ci@FORGE_CI_COMMIT
      - name: Download data-only evidence
        run: forge-ci artifact download --name "runtime-evidence-$TARGET" --dir evidence/
      - uses: https://forge.example/owner/forge-ci/.forgejo/actions/registry-login@FORGE_CI_COMMIT
        with:
          registry: ghcr.io
          username: ${{ vars.RELEASE_REGISTRY_USER }}
          token: ${{ secrets.RELEASE_REGISTRY_TOKEN }}
          create-auth-file: 'true'
          export-env: 'true'
      - name: Verify index identity and bind the signing key
        working-directory: evidence
        env:
          TRUSTED_KEY_INPUT: ${{ vars.COSIGN_PUBLIC_KEY }}
          TRUSTED_KEY_SHA256: ${{ vars.COSIGN_PUBLIC_KEY_SHA256 }}
          COSIGN_KEY: ${{ secrets.RELEASE_COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.RELEASE_COSIGN_PASSPHRASE }}
        run: |
          set -euo pipefail
          public_key=$(printf '%s' "$TRUSTED_KEY_INPUT")
          printf '%s\n' "$public_key" >cosign.pub
          [[ "${TRUSTED_KEY_SHA256:?}" =~ ^[a-f0-9]{64}$ ]]
          printf '%s\n' "$TRUSTED_KEY_SHA256" >cosign.pub.sha256
          forge-ci validate signing-key --key env://COSIGN_KEY --trusted-public-key cosign.pub --trusted-public-key-digest cosign.pub.sha256
          ref=$(jq -er .ref image.json)
          archs=$(jq -r '.[]' <<<"$ARCHS_JSON")
          forge-ci container multiarch-image verify --auth-file "$REGISTRY_AUTH_FILE" \
            --source-sha "$SOURCE_SHA" --server-url "$FORGEJO_SERVER" --repository "$FORGEJO_REPO" \
            --image-repository "$IMAGE_REPOSITORY" --tag "$CANDIDATE_TAG" \
            --name "runtime-$TARGET" --archs "$archs" --ref "$ref"
      - name: Sign image and attest native SBOMs and source provenance
        working-directory: evidence
        env:
          COSIGN_KEY: ${{ secrets.RELEASE_COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.RELEASE_COSIGN_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Cosign uses the Docker keychain; registry-login owns a separate
          # containers-auth file. Keep this bridge private and step-local.
          DOCKER_CONFIG=$(mktemp -d "${RUNNER_TEMP:?}/runtime-registry.XXXXXX")
          export DOCKER_CONFIG
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          install -m 0600 "$REGISTRY_AUTH_FILE" "$DOCKER_CONFIG/config.json"
          ref=$(jq -er .ref image.json)
          archs=$(jq -er '.[]' <<<"$ARCHS_JSON")
          forge-ci container sign --method kms --key env://COSIGN_KEY "$ref"
          while read -r arch; do
            child=$(jq -er .ref "runtime-$TARGET-arch-$arch/runtime-$TARGET-$arch.json")
            expected=$(awk -v file="sbom-$arch.json" '$2 == file { print $1 }' sboms.sha256)
            [[ "$expected" =~ ^[a-f0-9]{64}$ ]]
            printf '%s  sbom-%s.json\n' "$expected" "$arch" | sha256sum --check --strict
            forge-ci container attest --method kms --key env://COSIGN_KEY \
              --type cyclonedx --predicate "sbom-$arch.json" "$child"
          done <<<"$archs"
          forge-ci container attest --method kms --key env://COSIGN_KEY \
            --type slsaprovenance1 --flavor "$TARGET" "$ref"
      - name: Remove registry credentials
        if: always()
        run: test -z "${REGISTRY_AUTH_FILE:-}" || rm -f -- "$REGISTRY_AUTH_FILE"
  publish:
    needs: [plan, sign]
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABEL) }}
    container: ${{ vars.CI_SIGNER_IMAGE }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.image-matrix) }}
    env:
      TARGET: ${{ matrix.target }}
      IMAGE_REPOSITORY: ${{ vars.RUNTIME_IMAGE_NAMESPACE }}/${{ matrix.name }}
      ARCHS_JSON: ${{ toJSON(matrix.archs) }}
      CANDIDATE_TAG: ${{ needs.plan.outputs.candidate-tag }}
    steps:
      - uses: https://forge.example/owner/forge-ci/.forgejo/actions/setup-forge-ci@FORGE_CI_COMMIT
      - run: forge-ci artifact download --name "runtime-evidence-$TARGET" --dir evidence/
      - uses: https://forge.example/owner/forge-ci/.forgejo/actions/registry-login@FORGE_CI_COMMIT
        with:
          registry: ghcr.io
          username: ${{ vars.RELEASE_REGISTRY_USER }}
          token: ${{ secrets.RELEASE_REGISTRY_TOKEN }}
          create-auth-file: 'true'
          export-env: 'true'
      - name: Verify signatures and reject a stale main before promotion
        working-directory: evidence
        env:
          TRUSTED_KEY_INPUT: ${{ vars.COSIGN_PUBLIC_KEY }}
          TRUSTED_KEY_SHA256: ${{ vars.COSIGN_PUBLIC_KEY_SHA256 }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -euo pipefail
          DOCKER_CONFIG=$(mktemp -d "${RUNNER_TEMP:?}/runtime-registry.XXXXXX")
          export DOCKER_CONFIG
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          install -m 0600 "$REGISTRY_AUTH_FILE" "$DOCKER_CONFIG/config.json"
          public_key=$(printf '%s' "$TRUSTED_KEY_INPUT")
          printf '%s\n' "$public_key" >cosign.pub
          [[ "${TRUSTED_KEY_SHA256:?}" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  cosign.pub\n' "$TRUSTED_KEY_SHA256" | sha256sum --check --strict
          ref=$(jq -er .ref image.json)
          archs=$(jq -r '.[]' <<<"$ARCHS_JSON")
          forge-ci container multiarch-image verify --auth-file "$REGISTRY_AUTH_FILE" \
            --source-sha "$SOURCE_SHA" --server-url "$FORGEJO_SERVER" --repository "$FORGEJO_REPO" \
            --image-repository "$IMAGE_REPOSITORY" --tag "$CANDIDATE_TAG" \
            --name "runtime-$TARGET" --archs "$archs" --ref "$ref"
          cosign verify --key cosign.pub --insecure-ignore-tlog=true "$ref" >/dev/null
          cosign verify-attestation --key cosign.pub --insecure-ignore-tlog=true --type slsaprovenance1 "$ref" >/dev/null
          while read -r arch; do
            child=$(jq -er .ref "runtime-$TARGET-arch-$arch/runtime-$TARGET-$arch.json")
            cosign verify --key cosign.pub --insecure-ignore-tlog=true "$child" >/dev/null
            cosign verify-attestation --key cosign.pub --insecure-ignore-tlog=true --type cyclonedx "$child" >/dev/null
          done <<<"$archs"
          # Read the private source through its forge token, not the GHCR token.
          # The authorization header stays off argv; redirects are not followed.
          source_token=${FORGEJO_TOKEN:?}
          export -n source_token
          unset FORGEJO_TOKEN
          current=$(printf 'header = "Authorization: token %s"\n' "$source_token" |
            curl --config - --proto '=https' --fail --silent --show-error \
              --connect-timeout 15 --max-time 60 \
              "$FORGEJO_SERVER/api/v1/repos/$FORGEJO_REPO/branches/main" | jq -er '.commit.id')
          test "$current" = "$SOURCE_SHA" || { echo 'Refusing stale runtime publication' >&2; exit 1; }
          # Preserve the already signed index bytes and its children exactly.
          skopeo copy --all --preserve-digests --authfile "$REGISTRY_AUTH_FILE" \
            "docker://$ref" "docker://$IMAGE_REPOSITORY:sha-$SOURCE_SHA"
          printf '%s\n' "$ref" >published-ref.txt
      - name: Verify published digest and report the consumer pin
        working-directory: evidence
        run: |
          set -euo pipefail
          ref=$(cat published-ref.txt)
          # Authenticated verification works for private and public packages.
          # Read the promoted tag, not merely the already-existing candidate.
          skopeo inspect --authfile "$REGISTRY_AUTH_FILE" --raw \
            "docker://$IMAGE_REPOSITORY:sha-$SOURCE_SHA" >served-index.json
          expected=${ref##*@sha256:}
          printf '%s  served-index.json\n' "$expected" | sha256sum --check --strict
          printf 'Published runtime: %s\n' "$ref"
          forge-ci artifact upload --name "runtime-published-$TARGET" --dir . --retention-days 30 --if-no-files error
      - name: Remove registry credentials
        if: always()
        run: test -z "${REGISTRY_AUTH_FILE:-}" || rm -f -- "$REGISTRY_AUTH_FILE"
