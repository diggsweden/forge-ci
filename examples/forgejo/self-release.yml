# Opt-in self-release for a Forge CI fork. Copy to .forgejo/workflows only
# after replacing FORGE_HOST, OWNER and every PIN_* with reviewed coordinates.
# Publish the pinned bootstrap binaries and matching signer before activation.
name: Release Forge CI
on:
  push:
    tags: ['release-request/v*']
concurrency:
  group: forge-ci-self-release-${{ forgejo.repository }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  candidate:
    name: Test the release request commit
    if: (forgejo.server_url == 'https://FORGE_HOST' || forgejo.server_url == 'https://FORGE_HOST/') && forgejo.repository == 'OWNER/forge-ci'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABEL) }}
    timeout-minutes: 45
    steps:
      - name: Check required release variables
        env:
          RELEASE_BOT_NAME: ${{ vars.RELEASE_BOT_NAME }}
          RELEASE_BOT_EMAIL: ${{ vars.RELEASE_BOT_EMAIL }}
          RELEASE_GIT_HOST_KEY_FINGERPRINT: ${{ vars.RELEASE_GIT_HOST_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          missing=0
          for name in RELEASE_BOT_NAME RELEASE_BOT_EMAIL RELEASE_GIT_HOST_KEY_FINGERPRINT; do
            if [[ ! "${!name:-}" =~ [^[:space:]] ]]; then
              printf 'ERROR: set the %s Actions variable before requesting a release.\n' "$name" >&2
              missing=1
            fi
          done
          exit "$missing"
      - uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/checkout-consumer@PIN_FORGE_CI_SHA
        with:
          ref: ${{ forgejo.sha }}
          object-format: sha1
      - uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/setup-toolchain@PIN_FORGE_CI_SHA
        with:
          # Validate every build tool before prepare creates the final tag.
          # The host must commit a reviewed mise.lock for its native runners.
          tools: go aqua:goreleaser/goreleaser aqua:anchore/syft yq
          mise-locked: 'true'
          install-dev-tools: 'false'
          cache: 'false'
      - name: Check the release code and bootstrap checksums
        run: |
          set -eu
          go mod download
          go mod verify
          # The full development gate must pass before requesting a release.
          go test -race -buildvcs=false ./internal/app/release ./internal/cli/commands/release
          bash scripts/ci/engine-binary.sh check

  prepare:
    name: Prepare the release and create its tag
    needs: candidate
    if: ${{ needs.candidate.result == 'success' }}
    uses: OWNER/forge-ci/.forgejo/workflows/prepare-release.yml@PIN_FORGE_CI_SHA
    with:
      forge-ci-repository: https://FORGE_HOST/OWNER/forge-ci.git
      forge-ci-sha: PIN_FORGE_CI_SHA
      runs-on: ${{ vars.CI_RUNNER_LABEL }}
      signer-image: FORGE_HOST/OWNER/forge-ci-signer@sha256:PIN_SIGNER_IMAGE_DIGEST
      release-branch: ${{ vars.RELEASE_BRANCH }}
      bot-name: ${{ vars.RELEASE_BOT_NAME }}
      bot-email: ${{ vars.RELEASE_BOT_EMAIL }}
      release-git-url: ${{ vars.RELEASE_GIT_URL }}
      release-git-host-key-fingerprint: ${{ vars.RELEASE_GIT_HOST_KEY_FINGERPRINT }}
      changelog-config: templates/gitcliff/keepachangelog.toml
      commit-body-config: templates/gitcliff/minimal.toml
      artifacts-config: .forge-ci/artifacts.yml
      verify-release-request-signature: 'true'
      sign-distro-packages: 'false'
      publish-containers: 'false'
    secrets:
      RELEASE_SSH_SIGNING_KEY: ${{ secrets.RELEASE_SSH_SIGNING_KEY }}
      RELEASE_COSIGN_PRIVATE_KEY: ${{ secrets.RELEASE_COSIGN_PRIVATE_KEY }}
      RELEASE_COSIGN_PASSPHRASE: ${{ secrets.RELEASE_COSIGN_PASSPHRASE }}
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
      RELEASE_GPG_FINGERPRINT: ${{ secrets.RELEASE_GPG_FINGERPRINT }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      RELEASE_REGISTRY_TOKEN: ${{ secrets.RELEASE_REGISTRY_TOKEN }}

  build:
    name: Build unsigned release archives
    needs: prepare
    if: ${{ needs.prepare.result == 'success' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABEL) }}
    timeout-minutes: 40
    outputs:
      dist-digest: ${{ steps.dist.outputs.digest }}
    steps:
      - uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/setup-forge-ci@PIN_FORGE_CI_SHA
      - name: Check out the prepared commit with its tags
        env:
          FORGE_CI_PROVIDER: forgejo
          FORGEJO_TOKEN: ${{ forgejo.token }}
          CHECKOUT_REF: ${{ needs.prepare.outputs.release-sha }}
        run: forge-ci platform checkout --object-format sha1 --fetch-all-refs
      - uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/setup-toolchain@PIN_FORGE_CI_SHA
        with:
          tools: go aqua:goreleaser/goreleaser aqua:anchore/syft yq
          mise-locked: 'true'
          install-dev-tools: 'false'
          cache: 'false'
      - name: Prepare unsigned packaging inputs outside the checkout
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
        run: |
          set -euo pipefail
          forge-ci release notes --changelog-file CHANGELOG.md \
            --target-file "${RUNNER_TEMP:?}/release-notes.md" --release-version "$RELEASE_TAG"
          # Do not alter the upstream GoReleaser publisher. This build hands
          # unsigned files to a separate signing/publication job instead.
          yq '.release.disable = true | .checksum.disable = true | del(.signs)' .goreleaser.yml >"$RUNNER_TEMP/goreleaser-unsigned.yml"
      - uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/build-goreleaser@PIN_FORGE_CI_SHA
        with:
          release-tag: ${{ needs.prepare.outputs.release-tag }}
          release-sha: ${{ needs.prepare.outputs.release-sha }}
          config: ${{ runner.temp }}/goreleaser-unsigned.yml
          release-notes: ${{ runner.temp }}/release-notes.md
      - uses: https://FORGE_HOST/OWNER/forge-ci/.forgejo/actions/upload-dist@PIN_FORGE_CI_SHA
        id: dist
        with:
          artifact-name: build-dist
          path: dist/

  sign-and-publish:
    name: Sign and publish the Forgejo release
    needs: [prepare, build]
    if: ${{ needs.prepare.result == 'success' && needs.build.result == 'success' }}
    uses: OWNER/forge-ci/.forgejo/workflows/sign-and-publish-release.yml@PIN_FORGE_CI_SHA
    with:
      forge-ci-repository: https://FORGE_HOST/OWNER/forge-ci.git
      forge-ci-sha: PIN_FORGE_CI_SHA
      runs-on: ${{ vars.CI_RUNNER_LABEL }}
      signer-runs-on: ${{ vars.CI_RUNNER_LABEL }}
      signer-image: FORGE_HOST/OWNER/forge-ci-signer@sha256:PIN_SIGNER_IMAGE_DIGEST
      cosign-public-key: ${{ vars.COSIGN_PUBLIC_KEY }}
      cosign-public-key-sha256: PIN_COSIGN_PUBLIC_KEY_SHA256
      release-tag: ${{ needs.prepare.outputs.release-tag }}
      release-sha: ${{ needs.prepare.outputs.release-sha }}
      release-request-sha: ${{ forgejo.sha }}
      artifacts-config: ${{ needs.prepare.outputs.artifacts-config }}
      dist-digest: ${{ needs.build.outputs.dist-digest }}
      caller-workflow: self-release.yml
      sign-distro-packages: 'false'
    secrets:
      RELEASE_COSIGN_PRIVATE_KEY: ${{ secrets.RELEASE_COSIGN_PRIVATE_KEY }}
      RELEASE_COSIGN_PASSPHRASE: ${{ secrets.RELEASE_COSIGN_PASSPHRASE }}
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
      RELEASE_GPG_FINGERPRINT: ${{ secrets.RELEASE_GPG_FINGERPRINT }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      RELEASE_REGISTRY_TOKEN: ${{ secrets.RELEASE_REGISTRY_TOKEN }}
