name: Pull Request Workflow

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-checks:
    uses: diggsweden/forge-ci/.github/workflows/pullrequest-orchestrator.yml@v0.90.0
    secrets:
      # Optional: uploads lint security findings (SARIF) to Code Scanning.
      CODE_SCANNING_TOKEN: ${{ secrets.CODE_SCANNING_TOKEN }}
    permissions:
      actions: read
      contents: read
    with:
      forge-ci-binary-ref: v0.90.0
      project-type: cargo
      # The lint image, pinned by digest: the plan job refuses a tag.
      nanolinter-image: ghcr.io/itiquette/nanolinter:rust@sha256:PIN_DIGEST
      lint-engine: nanolinter

  # Your tests. The orchestrator above never runs them; require this job and
  # pr-checks as status checks. Add the feature combinations your workspace needs.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: cargo test --workspace
