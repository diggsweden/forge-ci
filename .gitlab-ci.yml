#
# forge-ci's OWN GitLab pipeline (the GitLab analog of .github/workflows/
# self-*.yml), distinct from the consumable components under templates/. It
# builds/tests its own source on merge requests and manual/API pipelines, and
# publishes the components to the CI/CD Catalog on a semver tag, using the
# `release` keyword (required by GitLab — not the Releases API). The
# components render in test/gitlabbehavior and run in the live tier, which
# binds the reviewed images they require.
#
# Prerequisite for publication: mark the project as a CI/CD Catalog project
# (Settings > CI/CD > Catalog) and give it a description. Provider acceptance
# requirements are documented in docs/providers.md and docs/live-runs.md.
stages:
  - test
  - release

self-build:
  stage: test
  # Administrator-selected native Go runtime, pinned by digest; see docs/testing.md.
  image:
    name: $FORGE_CI_SELF_BUILD_IMAGE
    docker:
      user: '65532:65532'
    kubernetes:
      user: '65532:65532'
  timeout: 30m
  variables:
    GIT_SUBMODULE_STRATEGY: none
    GOTOOLCHAIN: local
    GOMAXPROCS: '2'
    GOFLAGS: -p=2
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
  script:
    # The source-checkout helper has its own filesystem and home directory.
    # Select the build user's home only after that helper has finished.
    - export HOME=/home/nonroot
    - mise trust .mise.toml
    - mise install aqua:casey/just aqua:koalaman/shellcheck
    - 'export PATH="$(mise bin-paths aqua:casey/just aqua:koalaman/shellcheck | paste -sd: -):$PATH"'
    - just build
    - just test-unit -timeout 15m
    - just test-smoke
    - just test-fuzz
    - go vet ./...
    - ./bin/forge-ci --version

# Publish to the CI/CD Catalog when a semver tag is pushed.
create-release:
  stage: release
  # GitLab's release keyword uses glab; release-cli is deprecated.
  image: registry.gitlab.com/gitlab-org/cli:v1.122.0@sha256:ca113f949a17d119984884b8937ae7aeff7b471ecaafc6ade015cc9c23707fc9
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  script:
    - echo "Releasing $CI_COMMIT_TAG to the CI/CD Catalog"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "forge-ci GitLab CI/CD Catalog components — $CI_COMMIT_TAG"
